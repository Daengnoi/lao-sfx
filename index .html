<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ຕົວອັກສອນສຽງມັງງະ · Lao SFX Generator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@100..900&family=Noto+Serif+Lao:wght@100..900&family=Noto+Sans+Lao+Looped:wght@100..900&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1ea;--panel:#fff;--ink:#15171c;--mute:#5d6470;--line:#d9d5ca;--acc:#c8102e;--accink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161b;--panel:#1d2027;--ink:#eef0f4;--mute:#9aa1ae;--line:#323744;--acc:#ff4b5c;--accink:#14161b}}
:root[data-theme="dark"]{--bg:#14161b;--panel:#1d2027;--ink:#eef0f4;--mute:#9aa1ae;--line:#323744;--acc:#ff4b5c;--accink:#14161b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans Lao",system-ui,sans-serif}
header{padding:18px 20px 6px;max-width:1280px;margin:auto}
h1{margin:0;font-size:24px;font-weight:800}
header p{margin:2px 0 0;color:var(--mute);font-size:13px}
main{max-width:1280px;margin:auto;padding:12px 20px 40px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.stage{position:sticky;top:12px;align-self:start}
canvas{width:100%;height:auto;display:block;border-radius:8px;background-color:#fff;background-image:linear-gradient(45deg,#e6e6e6 25%,transparent 25%,transparent 75%,#e6e6e6 75%),linear-gradient(45deg,#e6e6e6 25%,transparent 25%,transparent 75%,#e6e6e6 75%);background-size:20px 20px;background-position:0 0,10px 10px}
h2{font-size:13px;margin:14px 0 6px;color:var(--mute);font-weight:700;letter-spacing:.02em}
h2:first-child{margin-top:0}
textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
textarea{font-size:20px;resize:vertical;min-height:70px}
.row{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;margin:4px 0;font-size:13px}
.row output{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=color]{width:100%;height:30px;border:1px solid var(--line);border-radius:6px;background:none;padding:2px}
.chips,.seg,.btns{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--acc)}
button.on,button.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}
.chips button{font-size:18px;padding:4px 12px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px;color:var(--mute)}
.btns{margin-top:12px}.btns button{flex:1}
</style>
</head>
<body>
<header>
<h1>ຕົວອັກສອນສຽງມັງງະ</h1>
<p>Lao Manga SFX Generator · ພິມຄຳ ແລ້ວປັບຮູບແບບ ບັນທຶກເປັນ PNG ພື້ນໂປ່ງໃສ ຫຼື SVG</p>
</header>
<main>
<section class="card stage">
<canvas id="cv" width="1200" height="700"></canvas>
<div class="btns">
<button class="pri" id="png">ບັນທຶກ PNG</button>
<button id="svg">ບັນທຶກ SVG</button>
<button id="pdf">ບັນທຶກ PDF</button>
<button id="psd">ບັນທຶກ PSD (ແຍກເລເຢີ)</button>
<button id="copy">ສຳເນົາ</button>
<button id="rnd">ສຸ່ມຮູບແບບ</button>
</div>
</section>
<section class="card" id="panel">
<h2>ຂໍ້ຄວາມ</h2>
<textarea id="text">ຕູ້ມ!</textarea>
<div class="chips" id="chips" style="margin-top:8px"></div>
<h2>ຟອນ</h2>
<select id="font">
<option>Noto Sans Lao</option>
<option>Noto Serif Lao</option>
<option>Noto Sans Lao Looped</option>
</select>
<label style="display:block;margin-top:8px"><button type="button" onclick="this.nextElementSibling.click()">＋ ໂຫຼດຟອນຂອງທ່ານ (.woff2 .ttf .otf)</button><input type="file" id="ff" accept=".woff2,.woff,.ttf,.otf" hidden></label>
<div class="seg" style="margin-top:8px" id="vert"><button data-v="0" class="on">ແນວນອນ</button><button data-v="1">ແນວຕັ້ງ</button></div>
<h2>ຮູບຮ່າງ</h2>
<div id="sl"></div>
<h2>ການຕື່ມສີ</h2>
<div class="seg" id="fill"><button data-v="solid" class="on">ເຕັມ</button><button data-v="dot">ຈຸດໂທນ</button><button data-v="neg">ລົບສີ</button></div>
<div class="cols" style="margin-top:8px">
<label>ຕົວອັກສອນ<input type="color" id="c1" value="#15171c"></label>
<label>ຂອບ<input type="color" id="cout" value="#ffffff"></label>
<label>ເງົາ/ພື້ນ<input type="color" id="c2" value="#c8102e"></label>
</div>
<h2>ພື້ນຫຼັງ ແລະ ຂະໜາດໄຟລ໌</h2>
<div class="seg" id="bg"><button data-v="none" class="on">ໂປ່ງໃສ</button><button data-v="#ffffff">ຂາວ</button></div>
<div class="seg" id="sc" style="margin-top:8px"><button data-v="1">1×</button><button data-v="2" class="on">2×</button><button data-v="3">3×</button></div>
<p style="color:var(--mute);font-size:12px;margin:12px 0 0">ໝາຍເຫດ: ໄຟລ໌ SVG ບໍ່ຝັງຟອນ ຈຶ່ງຕ້ອງມີຟອນ Noto Lao ຕິດຕັ້ງໃນເຄື່ອງ ຫຼື ແປງເປັນເສັ້ນໃນໂປຣແກຣມແກ້ໄຂ. ທຸກຢ່າງເຮັດວຽກໃນບຣາວເຊີ ບໍ່ສົ່ງຂໍ້ມູນອອກ.</p>
</section>
</main>
<script>
const $=s=>document.querySelector(s),W=1200,H=700;
const P={font:'Noto Sans Lao',size:260,weight:900,space:0,arc:0,slope:0,skew:0,jit:15,r0:100,r1:100,out:14,ext:0,ghost:0,seed:7,fill:'solid',vert:0,bg:'none',sc:2};
const SL=[['size','ຂະໜາດ',60,420,1],['weight','ຄວາມໜາ',100,900,100],['space','ໄລຍະຫ່າງ',-60,120,1],['arc','ໂຄ້ງ',-100,100,1],['slope','ຄວາມຊັນ',-45,45,1],['skew','ເອນ',-30,30,1],['jit','ຄວາມສັ່ນ',0,100,1],['r0','ຂະໜາດເລີ່ມ',30,250,1],['r1','ຂະໜາດທ້າຍ',30,250,1],['out','ຂອບ',0,40,1],['ext','ມິຕິ (3D)',0,40,1],['ghost','ພາບຕາມ',0,6,1],['seed','Seed',1,99,1]];
const WORDS=['ຕູ້ມ!','ວູບ!','ຜັວະ!','ປັງ!','ຄຶກຄັກ','ຕຶກຕັກ','ຊ່າ','ຫຼຸບ'];
let busy=0;const CF={};
$('#ff').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{const n='Custom'+Object.keys(CF).length;try{const ff=new FontFace(n,`url(${r.result})`);await ff.load();document.fonts.add(ff);CF[n]=r.result;const o=new Option(f.name,n);$('#font').add(o);$('#font').value=n;go()}catch(x){alert('ໂຫຼດຟອນບໍ່ໄດ້')}};r.readAsDataURL(f)};
$('#chips').innerHTML=WORDS.map(w=>`<button>${w}</button>`).join('');
$('#chips').onclick=e=>{if(e.target.tagName=='BUTTON'){$('#text').value=e.target.textContent;go()}};
$('#sl').innerHTML=SL.map(([k,l,a,b,s])=>`<div class="row"><span>${l}</span><input type="range" id="r_${k}" min="${a}" max="${b}" step="${s}" value="${P[k]}"><output id="o_${k}">${P[k]}</output></div>`).join('');
SL.forEach(([k])=>$('#r_'+k).oninput=e=>{P[k]=+e.target.value;$('#o_'+k).textContent=P[k];go()});
function seg(id,key){$(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;[...$(id).children].forEach(x=>x.classList.toggle('on',x==b));P[key]=isNaN(b.dataset.v)?b.dataset.v:+b.dataset.v;go()}}
seg('#fill','fill');seg('#vert','vert');seg('#bg','bg');seg('#sc','sc');
['#text','#font','#c1','#c2','#cout'].forEach(s=>$(s).oninput=go);

function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const LEAD='ເແໂໄໃ',TAIL='ະາຳຽໆ';
function clusters(s){
  const out=[];
  for(const {segment:g} of new Intl.Segmenter('lo',{granularity:'grapheme'}).segment(s)){
    const prev=out[out.length-1];
    if(prev&&(TAIL.includes(g[0])||(prev.length==1&&LEAD.includes(prev)))) out[out.length-1]+=g; else out.push(g);
  }
  return out;
}
const fontStr=()=>`${P.weight} ${P.size}px "${P.font}", "Noto Sans Lao", sans-serif`;
function layout(){
  const m=document.createElement('canvas').getContext('2d');m.font=fontStr();
  const R=rng(P.seed),lines=$('#text').value.split('\n'),L=lines.length,lh=P.size*1.2,items=[];
  let maxW=0,maxH=0;
  lines.forEach((ln,li)=>{
    const cl=clusters(ln),n=cl.length;if(!n)return;
    const ss=cl.map((c,i)=>{const t=n>1?i/(n-1):.5;return(P.r0+(P.r1-P.r0)*t)/100*(1+(R()-.5)*P.jit/60)});
    const ws=cl.map((c,i)=>(P.vert?P.size*.95:m.measureText(c).width)*ss[i]);
    const tot=ws.reduce((a,b)=>a+b,0)+P.space*(n-1);
    maxW=Math.max(maxW,P.vert?lh*L:tot);maxH=Math.max(maxH,P.vert?tot:lh*L);
    let p=-tot/2;
    cl.forEach((c,i)=>{
      const t=n>1?i/(n-1):.5,cx=p+ws[i]/2;p+=ws[i]+P.space;
      const off=(li-(L-1)/2)*lh,tn=Math.tan(P.slope*Math.PI/180);
      const bow=-P.arc/100*P.size*(1-(2*t-1)**2);
      const rot=Math.atan(tn)+P.arc/100*(2*t-1)*.7+(R()-.5)*P.jit/100;
      const j=(R()-.5)*P.jit/100*P.size*.4;
      const it=P.vert?{c,x:-off,y:cx+bow*.2,rot:rot*.3}:{c,x:cx,y:off+cx*tn+bow+j,rot};
      it.s=ss[i];items.push(it);
    });
  });
  const f=Math.min(1,W*.9/(maxW||1),H*.9/(maxH||1));
  return{items,f};
}
function dotPat(c,col){
  const t=document.createElement('canvas');t.width=t.height=12;const x=t.getContext('2d');
  x.fillStyle=col;x.beginPath();x.arc(6,6,3.4,0,7);x.fill();
  const p=c.createPattern(t,'repeat');p.setTransform(new DOMMatrix().rotate(45));return p;
}
function draw(c,k,only){
  const neg=P.fill=='neg',col1=$('#c1').value,col2=$('#c2').value,colO=$('#cout').value;
  c.setTransform(k,0,0,k,0,0);c.clearRect(0,0,W,H);
  if((neg||P.bg!='none')&&(!only||only=='bg')){c.fillStyle=neg?col2:P.bg;c.fillRect(0,0,W,H)}
  const{items,f}=layout();
  c.translate(W/2,H/2);c.scale(f,f);
  c.font=fontStr();c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';
  const fillS=P.fill=='dot'?dotPat(c,col1):neg?'#ffffff':col1,outC=neg?col2:colO,shC=neg?'#000000':col2;
  c.lineWidth=P.out*2;
  for(const it of (only=='bg'?[]:items)){
    c.save();c.translate(it.x,it.y);c.rotate(it.rot);c.transform(1,0,-P.skew/45,1,0,0);c.scale(it.s,it.s);
    if(!only||only=='fx'){
    for(let g=P.ghost;g>=1;g--){c.globalAlpha=.1+.05*(P.ghost-g);c.fillStyle=col1;c.fillText(it.c,-g*P.size*.07,0)}
    c.globalAlpha=1;
    for(let e=P.ext;e>=1;e--){c.fillStyle=c.strokeStyle=shC;if(P.out)c.strokeText(it.c,e*.8,e*.8);c.fillText(it.c,e*.8,e*.8)}}
    if(P.out&&(!only||only=='out')){c.strokeStyle=outC;c.strokeText(it.c,0,0)}
    if(!only||only=='fill'){c.fillStyle=fillS;c.fillText(it.c,0,0)}
    c.restore();
  }
}
async function go(){
  if(busy)return;busy=1;
  P.font=$('#font').value;
  try{await document.fonts.load(`${P.weight} 40px "${P.font}"`,'ກຂຄ')}catch(e){}
  busy=0;draw($('#cv').getContext('2d'),1);
}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function big(){const c=document.createElement('canvas');c.width=W*P.sc;c.height=H*P.sc;draw(c.getContext('2d'),P.sc);return c}
$('#png').onclick=()=>big().toBlob(b=>dl(b,'lao-sfx.png'));
$('#copy').onclick=async e=>{const b=e.target;try{const bl=await new Promise(r=>big().toBlob(r));await navigator.clipboard.write([new ClipboardItem({'image/png':bl})]);b.textContent='ສຳເນົາແລ້ວ'}catch(x){b.textContent='ບໍ່ສາມາດສຳເນົາໄດ້'}setTimeout(()=>b.textContent='ສຳເນົາ',1500)};
$('#svg').onclick=()=>{
  const neg=P.fill=='neg',col1=$('#c1').value,col2=$('#c2').value,colO=$('#cout').value;
  const{items,f}=layout(),esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  const fill=neg?'#ffffff':col1,outC=neg?col2:colO,shC=neg?'#000000':col2;
  const attr=`font-family="${P.font}, Noto Sans Lao, sans-serif" font-size="${P.size}" font-weight="${P.weight}" text-anchor="middle" dominant-baseline="central"`;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  if(CF[P.font])s+=`<style>@font-face{font-family:"${P.font}";src:url(${CF[P.font]})}</style>`;
  if(neg||P.bg!='none')s+=`<rect width="${W}" height="${H}" fill="${neg?col2:P.bg}"/>`;
  s+=`<g transform="translate(${W/2} ${H/2}) scale(${f})" ${attr} stroke-linejoin="round">`;
  for(const it of items){
    s+=`<g transform="translate(${it.x.toFixed(1)} ${it.y.toFixed(1)}) rotate(${(it.rot*180/Math.PI).toFixed(2)}) skewX(${-P.skew}) scale(${it.s.toFixed(3)})">`;
    for(let e=P.ext;e>=1;e--)s+=`<text x="${e*.8}" y="${e*.8}" fill="${shC}" stroke="${shC}" stroke-width="${P.out*2}">${esc(it.c)}</text>`;
    s+=`<text fill="${fill}" stroke="${outC}" stroke-width="${P.out*2}" paint-order="stroke">${esc(it.c)}</text></g>`;
  }
  dl(new Blob([s+'</g></svg>'],{type:'image/svg+xml'}),'lao-sfx.svg');
};
const u=(n,v)=>{v=(v+2**(8*n))%2**(8*n);const a=new Uint8Array(n);for(let i=n-1;i>=0;i--){a[i]=v%256;v=Math.floor(v/256)}return a};
const enc=t=>new TextEncoder().encode(t);
const len=a=>a.reduce((n,x)=>n+x.length,0);
function planar(d,w,h){return[0,1,2,3].map(i=>{const a=new Uint8Array(w*h);for(let p=0,j=i;p<w*h;p++,j+=4)a[p]=d[j];return a})}
$('#psd').onclick=()=>{
  const k=Math.min(P.sc,2),w=W*k,h=H*k,n=w*h,neg=P.fill=='neg';
  const defs=[];if(neg||P.bg!='none')defs.push(['bg','Background']);defs.push(['fx','Effects'],['out','Outline'],['fill','Fill']);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d',{willReadFrequently:true});
  const L=defs.map(([m,nm])=>{draw(cx,k,m);return{nm,ch:planar(cx.getImageData(0,0,w,h).data,w,h)}});
  draw(cx,k);const M=planar(cx.getImageData(0,0,w,h).data,w,h);
  const rec=[];
  for(const l of L){
    const nb=new Uint8Array(Math.ceil((1+l.nm.length)/4)*4);nb[0]=l.nm.length;nb.set(enc(l.nm),1);
    rec.push(u(4,0),u(4,0),u(4,h),u(4,w),u(2,4));
    for(const id of [0,1,2,-1])rec.push(u(2,id),u(4,2+n));
    rec.push(enc('8BIM'),enc('norm'),new Uint8Array([255,0,0,0]),u(4,8+nb.length),u(4,0),u(4,0),nb);
  }
  const data=[];for(const l of L)for(const c of l.ch)data.push(u(2,0),c);
  let li=2+len(rec)+len(data);if(li%2)li++;
  const parts=[enc('8BPS'),u(2,1),new Uint8Array(6),u(2,4),u(4,h),u(4,w),u(2,8),u(2,3),u(4,0),u(4,0),u(4,li+8),u(4,li),u(2,-L.length),...rec,...data];
  if(li!=2+len(rec)+len(data))parts.push(new Uint8Array(1));
  parts.push(u(4,0),u(2,0),...M);
  dl(new Blob(parts,{type:'image/vnd.adobe.photoshop'}),'lao-sfx.psd');
};
$('#pdf').onclick=async()=>{
  const c=big(),w=c.width,h=c.height,d=c.getContext('2d').getImageData(0,0,w,h).data;
  const rgb=new Uint8Array(w*h*3),al=new Uint8Array(w*h);
  for(let i=0,p=0;i<w*h;i++){rgb[p++]=d[i*4];rgb[p++]=d[i*4+1];rgb[p++]=d[i*4+2];al[i]=d[i*4+3]}
  const z=async a=>new Uint8Array(await new Response(new Blob([a]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer());
  const R=await z(rgb),A=await z(al),pw=W*.75,ph=H*.75,ct=enc(`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`);
  const objs=[enc('<</Type/Catalog/Pages 2 0 R>>'),enc('<</Type/Pages/Kids[3 0 R]/Count 1>>'),enc(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${pw} ${ph}]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 6 0 R>>`),
   [enc(`<</Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/FlateDecode/SMask 5 0 R/Length ${R.length}>>\nstream\n`),R,enc('\nendstream')],
   [enc(`<</Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/DeviceGray/BitsPerComponent 8/Filter/FlateDecode/Length ${A.length}>>\nstream\n`),A,enc('\nendstream')],
   [enc(`<</Length ${ct.length}>>\nstream\n`),ct,enc('\nendstream')]];
  const out=[enc('%PDF-1.4\n')],off=[];let pos=out[0].length;
  objs.forEach((o,i)=>{off.push(pos);const ps=[enc(`${i+1} 0 obj\n`),...(Array.isArray(o)?o:[o]),enc('\nendobj\n')];for(const p of ps){out.push(p);pos+=p.length}});
  let x=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;off.forEach(o=>x+=String(o).padStart(10,'0')+' 00000 n \n');
  out.push(enc(x+`trailer\n<</Size ${objs.length+1}/Root 1 0 R>>\nstartxref\n${pos}\n%%EOF`));
  dl(new Blob(out,{type:'application/pdf'}),'lao-sfx.pdf');
};
const SV='laosfx_fonts';
$('#ff').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const a=JSON.parse(localStorage.getItem(SV)||'[]');a.push({n:f.name,u:r.result});localStorage.setItem(SV,JSON.stringify(a))}catch(x){}};r.readAsDataURL(f)});
(async()=>{let a=[];try{a=JSON.parse(localStorage.getItem(SV)||'[]')}catch(x){}
 for(const [i,s] of a.entries()){try{const n='Saved'+i,ff=new FontFace(n,`url(${s.u})`);await ff.load();document.fonts.add(ff);CF[n]=s.u;$('#font').add(new Option(s.n,n))}catch(x){}}
 if(a.length)go()})();
$('#rnd').onclick=()=>{
  const r=(a,b)=>Math.round(a+Math.random()*(b-a)),set=(k,v)=>{P[k]=v;$('#r_'+k).value=v;$('#o_'+k).textContent=v};
  set('seed',r(1,99));set('arc',r(-60,60));set('slope',r(-20,20));set('skew',r(-15,15));set('jit',r(5,50));
  set('r0',r(60,110));set('r1',r(90,180));set('ext',r(0,18));set('ghost',r(0,3));set('out',r(8,22));
  $('#font').selectedIndex=r(0,2);go();
};
go();document.fonts.ready.then(go);
